<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Content pipeline diagram placeholder">
  <rect width="1000" height="260" fill="#f1f5f9"/>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <rect x="40" y="100" width="180" height="60" rx="10" fill="#145F95"/>
    <text x="130" y="136" fill="#ffffff">content/*.md</text>
    <rect x="300" y="100" width="200" height="60" rx="10" fill="#1F8A70"/>
    <text x="400" y="136" fill="#ffffff">build-content.mjs</text>
    <rect x="580" y="100" width="160" height="60" rx="10" fill="#145F95"/>
    <text x="660" y="136" fill="#ffffff">data/*.json</text>
    <rect x="820" y="100" width="150" height="60" rx="10" fill="#0F4D3C"/>
    <text x="895" y="136" fill="#ffffff">Pages</text>
    <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <line x1="222" y1="130" x2="298" y2="130"/>
      <line x1="502" y1="130" x2="578" y2="130"/>
      <line x1="742" y1="130" x2="818" y2="130"/>
    </g>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
